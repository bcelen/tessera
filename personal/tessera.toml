# aerospace.toml
#
# Drop-in replacement for ~/.aerospace.toml. 55 bindings, no modes.
#
# Four rules:
#   alt        where you go, and what things look like
#   ctrl       windows: focus, move, join, send to a workspace
#   hyper      the four commands only this fork has (needs Karabiner running)
#   alt-cmd    layout snapshots, shift to save
#
# Requires the 8 macOS ctrl-arrow and ctrl-shift-arrow shortcuts to be off.
# Run disable-space-shortcuts.py first.

config-version = 2

after-startup-command = ['workspace 1']

# No effect on this fork, which runs as an unsigned debug binary rather than an
# installed app. Left in so a release build would honor it.
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 60
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Scrolling layout (alt-quote). Hyper plus a two-finger sideways swipe steps one column.
# Set the duration to 150 to try a slide instead of a jump; 0 jumps
scrolling-swipe-modifiers = 'ctrl-alt-shift-cmd'
scrolling-animation-duration = 0
scrolling-default-column-width = 33  # new columns open at a third of the screen

automatically-unhide-macos-hidden-apps = false

# Lettered workspaces are W X Y Z, not A B C D. On a US layout alt-c is how you
# type ç, so binding it stole every ç and jumped to an empty workspace.
# alt-w/x/y/z produce ∑ ≈ ¥ Ω, which never appear in Turkish or English.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "W", "X", "Y", "Z"]

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
W = 'main'
X = 'main'
Y = 'main'
Z = 'main'

# ===========================================================================
# Bindings
# ===========================================================================

[mode.main.binding]

# --- alt: go to a workspace ------------------------------------------------

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-w = 'workspace W'
alt-x = 'workspace X'
alt-y = 'workspace Y'
alt-z = 'workspace Z'
alt-backtick = 'workspace-back-and-forth'

# --- alt: layout and size, all punctuation ---------------------------------

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-period = 'layout floating tiling'
alt-semicolon = 'flatten-workspace-tree'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-quote = 'layout scrolling tiles'               # whole workspace: scrolling strip <-> tiles
alt-backslash = 'column-width 33% 50% 67%'          # scrolling: cycle the column's width

# --- alt-shift: the two that can lose work ---------------------------------

alt-shift-r = 'reload-config'
alt-shift-backspace = 'close-all-windows-but-current'

# --- alt-cmd: layout snapshots, shift saves --------------------------------

alt-cmd-1 = 'layout-snapshot restore teaching'
alt-cmd-2 = 'layout-snapshot restore research'
alt-cmd-3 = 'layout-snapshot restore writing'
alt-cmd-4 = 'layout-snapshot restore admin'
alt-shift-cmd-1 = 'layout-snapshot save teaching'
alt-shift-cmd-2 = 'layout-snapshot save research'
alt-shift-cmd-3 = 'layout-snapshot save writing'
alt-shift-cmd-4 = 'layout-snapshot save admin'

# --- ctrl: send this window to a workspace and follow it -------------------
# Letters need ctrl-shift. ctrl-a, ctrl-b, ctrl-d and ctrl-e are readline
# bindings that every macOS text field honors, so binding them globally would
# break start-of-line and end-of-line everywhere.

ctrl-1 = ['move-node-to-workspace 1', 'workspace 1']
ctrl-2 = ['move-node-to-workspace 2', 'workspace 2']
ctrl-3 = ['move-node-to-workspace 3', 'workspace 3']
ctrl-4 = ['move-node-to-workspace 4', 'workspace 4']
ctrl-5 = ['move-node-to-workspace 5', 'workspace 5']
ctrl-6 = ['move-node-to-workspace 6', 'workspace 6']
ctrl-7 = ['move-node-to-workspace 7', 'workspace 7']
ctrl-shift-w = ['move-node-to-workspace W', 'workspace W']
ctrl-shift-x = ['move-node-to-workspace X', 'workspace X']
ctrl-shift-y = ['move-node-to-workspace Y', 'workspace Y']
ctrl-shift-z = ['move-node-to-workspace Z', 'workspace Z']

# --- ctrl: move around -----------------------------------------------------

ctrl-left = 'focus left'
ctrl-down = 'focus down'
ctrl-up = 'focus up'
ctrl-right = 'focus right'

ctrl-shift-left = 'move left'
ctrl-shift-down = 'move down'
ctrl-shift-up = 'move up'
ctrl-shift-right = 'move right'

ctrl-alt-left = 'join-with left'
ctrl-alt-down = 'join-with down'
ctrl-alt-up = 'join-with up'
ctrl-alt-right = 'join-with right'

# --- hyper: fork-only commands ---------------------------------------------
# Caps Lock produces ctrl-alt-shift-cmd via Karabiner. These four do not exist
# in released AeroSpace; comment them out before running a stock build.

ctrl-alt-shift-cmd-period = 'scratchpad toggle'
ctrl-alt-shift-cmd-comma = 'scratchpad move'
ctrl-alt-shift-cmd-h = 'window-hints show'
ctrl-alt-shift-cmd-g = 'sticky toggle'

# ===========================================================================
# Window rules
# ===========================================================================

# Specific rules first, so check-further-callbacks has something to stop.

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
if.window-title-regex-substring = 'm-imperfect information'
run = ['move-node-to-workspace W', 'fullscreen']
check-further-callbacks = false

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace 1'

# Everything below floats.

[[on-window-detected]]
if.app-name-regex-substring = 'System Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '1Password'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Bitwarden'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'BusyCal'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'NordVPN'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'App Store'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Calendar'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Copied'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'ForkLift'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Antinote'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'OBSBOT Center'
run = 'layout floating'

